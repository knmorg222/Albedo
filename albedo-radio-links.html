<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Albedo — The Radio Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #FBF3E3;
    --paper: #F6EAD2;
    --gold: #F3A417;
    --gold-deep: #DE8A16;
    --black: #1A1611;
    --maroon: #5C1B1B;
    --maroon-soft: #7A3B2C;
    --muted: #8a7a5c;
    --line: #e6d5ac;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  html, body{
    background: var(--cream);
    color: var(--black);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition: none !important; }
  }

  body{
    display:flex;
    justify-content:center;
    padding: 56px 20px 80px;
    background:
      radial-gradient(ellipse 620px 460px at 50% 2%, rgba(243,164,23,0.35), transparent 62%),
      radial-gradient(ellipse 700px 500px at 50% 100%, rgba(92,27,27,0.06), transparent 65%),
      var(--cream);
  }

  .page{
    width: 100%;
    max-width: 440px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* On-air marker */
  .onair{
    display:flex;
    align-items:center;
    gap: 8px;
    font-family:'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.03em;
    color: var(--maroon);
    margin-bottom: 22px;
  }
  .onair .dot{
    width:7px; height:7px; border-radius:50%;
    background: var(--gold);
    box-shadow: 0 0 8px 2px rgba(243,164,23,0.7);
    animation: pulse-dot 2.2s ease-in-out infinite;
  }
  @keyframes pulse-dot{
    0%, 100%{ opacity:1; }
    50%{ opacity:0.3; }
  }

  /* Logo */
  .logo-wrap{
    width: 200px;
    margin-bottom: 6px;
    animation: rise-in 0.9s cubic-bezier(.2,.9,.25,1) 1;
  }
  .logo-wrap img{
    width:100%;
    display:block;
    filter: drop-shadow(0 10px 24px rgba(92,27,27,0.18));
  }
  @keyframes rise-in{
    0%{ opacity:0; transform: translateY(10px) scale(0.97); }
    100%{ opacity:1; transform: translateY(0) scale(1); }
  }

  .tagline{
    text-align:center;
    color: var(--maroon-soft);
    font-family: 'Zilla Slab', serif;
    font-weight: 600;
    font-size: 17px;
    font-style: italic;
    margin: 10px 0 26px;
  }

  /* Equalizer */
  .eq{
    display:flex;
    align-items:flex-end;
    gap: 4px;
    height: 30px;
    margin-bottom: 36px;
  }
  .eq span{
    display:block;
    width: 4px;
    border-radius: 2px 2px 0 0;
    background: linear-gradient(180deg, var(--gold), var(--maroon));
    animation: eq-bounce 1.1s ease-in-out infinite;
  }
  .eq span:nth-child(1){ height:40%; animation-delay: -0.9s; }
  .eq span:nth-child(2){ height:70%; animation-delay: -0.4s; }
  .eq span:nth-child(3){ height:100%; animation-delay: -1.2s; }
  .eq span:nth-child(4){ height:55%; animation-delay: -0.1s; }
  .eq span:nth-child(5){ height:85%; animation-delay: -0.7s; }
  .eq span:nth-child(6){ height:35%; animation-delay: -1.5s; }
  .eq span:nth-child(7){ height:65%; animation-delay: -0.3s; }
  .eq span:nth-child(8){ height:95%; animation-delay: -1.0s; }
  .eq span:nth-child(9){ height:45%; animation-delay: -0.6s; }
  .eq span:nth-child(10){ height:75%; animation-delay: -0.2s; }
  .eq span:nth-child(11){ height:30%; animation-delay: -1.3s; }

  @keyframes eq-bounce{
    0%, 100%{ transform: scaleY(0.45); opacity:0.7; }
    50%{ transform: scaleY(1); opacity:1; }
  }

  /* Preset buttons */
  .presets{
    width:100%;
    display:flex;
    flex-direction:column;
    gap: 12px;
  }

  .preset{
    position:relative;
    display:flex;
    align-items:center;
    gap: 16px;
    width:100%;
    padding: 16px 18px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
    text-decoration:none;
    color: var(--black);
    transition: border-color 0.2s ease, transform 0.15s ease, background 0.2s ease;
  }
  .preset:hover{
    border-color: var(--gold-deep);
    background: #F9EFD8;
  }
  .preset:active{
    transform: scale(0.98);
  }

  .preset-num{
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    width: 16px;
    text-align:center;
    flex-shrink:0;
  }

  .preset-icon{
    width: 38px;
    height: 38px;
    border-radius: 50%;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .preset-icon.spotify{ background: var(--maroon); }
  .preset-icon.instagram{ background: var(--gold); }
  .preset-icon svg{ width:19px; height:19px; }

  .preset-text{
    flex:1;
    min-width:0;
  }
  .preset-text .label{
    font-family: 'Zilla Slab', serif;
    font-weight: 600;
    font-size: 16px;
  }
  .preset-text .detail{
    font-size: 12.5px;
    color: var(--muted);
    margin-top: 2px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .preset-go{
    flex-shrink:0;
    color: var(--maroon-soft);
    font-size: 16px;
  }

  footer{
    margin-top: 44px;
    text-align:center;
  }
  footer .rule{
    width: 220px;
    height: 1px;
    background: var(--line);
    margin: 0 auto 14px;
  }
  footer p{
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--gold-deep);
    letter-spacing: 0.03em;
  }
</style>
</head>
<body>
  <div class="page">

    <div class="onair"><span class="dot"></span>On air</div>

    <div class="logo-wrap">
      <img src="albedo-logo.png" alt="Albedo — The Radio Club logo, a microphone in front of a golden sun">
    </div>

    <p class="tagline">Every tune matters.</p>

    <div class="eq" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
    </div>

    <div class="presets">
      <a class="preset" href="https://open.spotify.com/show/4FdZugWiEi5LuM35I6WNcY?si=vbRskdStSGKPMLUjro6bAA" target="_blank" rel="noopener">
        <span class="preset-num">1</span>
        <span class="preset-icon spotify">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="#F3A417"/><path d="M8 10.2c2.6-.7 5.4-.5 7.6.9M8 12.8c2.2-.55 4.6-.4 6.5.75M8.3 15.3c1.8-.4 3.7-.3 5.2.6" stroke="#1A1611" stroke-width="1.2" stroke-linecap="round"/></svg>
        </span>
        <span class="preset-text">
          <div class="label">Listen to our podcast</div>
          <div class="detail">Spotify — Albedo Radio</div>
        </span>
        <span class="preset-go">↗</span>
      </a>

      <a class="preset" href="https://www.instagram.com/spec.radio?stkn=MTE0cWd2bzlvNGxjdQ==" target="_blank" rel="noopener">
        <span class="preset-num">2</span>
        <span class="preset-icon instagram">
          <svg viewBox="0 0 24 24" fill="none" stroke="#1A1611" stroke-width="1.6"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17" cy="7" r="1" fill="#1A1611" stroke="none"/></svg>
        </span>
        <span class="preset-text">
          <div class="label">Follow along</div>
          <div class="detail">Instagram — @spec.radio</div>
        </span>
        <span class="preset-go">↗</span>
      </a>
    </div>

    <footer>
      <div class="rule"></div>
      <p>TUNE IN · TURN UP · TALK BACK</p>
    </footer>

  </div>
</body>
</html>
